# ember-upgrade writes this file.
# Each entry is a workaround to undo later, or work that ember-upgrade left for you.
# Remove an entry when its work is done.
entries:
  - id: "package-manager"
    status: "todo"
    note: "yarn.lock became pnpm-lock.yaml, with the same versions. pnpm does not let a package import a dependency that its package.json does not list. If a build fails on a missing package, add that package to the package.json that imports it. pnpm skips the build scripts of dependencies. Run `pnpm approve-builds` to pick the ones the app needs, then remove `strictDepBuilds: false` from pnpm-workspace.yaml. `blockExoticSubdeps: false` lets a dependency install another package from git. Remove it when no dependency does that. These files still run yarn or npm: .github/workflows/ci.yml, README.md."
    links:
      - "https://pnpm.io/motivation"
      - "https://pnpm.io/cli/import"
      - "https://pnpm.io/cli/approve-builds"
  - id: "ember-fetch"
    status: "removed"
    note: "ember-fetch is removed, and the code uses the global fetch, through waitForFetch of @ember/test-waiters, so that tests wait for each request. ember-fetch rejected some responses that fetch resolves, so check the error handling of each call."
    links:
      - "https://rfcs.emberjs.com/id/1065-remove-ember-fetch"
  - id: "@nullvoxpopuli/legacy-prototype-extensions"
    status: "added"
    note: "Ember 6 removed the array prototype extensions, such as mapBy, objectAt, and firstObject on native arrays. app.js imports @nullvoxpopuli/legacy-prototype-extensions/array, which adds them back. Move the code to native array methods, then remove the import and the package."
    links:
      - "https://deprecations.emberjs.com/id/deprecate-array-prototype-extensions"
  - id: "ember-cli-mirage"
    status: "replaced"
    note: "ember-cli-mirage is replaced by ember-mirage. mirage/ stays next to app/ and tests/, and the app and the tests import it as #mirage/... (package.json \"imports\"). mirage/servers/default makes the server, with explicit imports in place of the runtime discovery. The mirage models for the ember-data models are generated files now: change them when a model changes. app/initializers/mirage starts mirage in development builds only, and reads ENV['ember-cli-mirage'] as before."
    links:
      - "https://github.com/bgantzler/ember-mirage/blob/main/docs/migration.md"
      - "https://mainmatter.com/blog/2026/07/14/ember-mirage/"
  - id: "@ember/test-waiters"
    status: "override"
    note: "An override forces the latest @ember/test-waiters for all dependencies, because v1 addons depend on older versions. Remove the override when no dependency needs an older version."
  - id: "@embroider/macros"
    status: "override"
    note: "An override forces the latest @embroider/macros for all dependencies, because v1 addons depend on older versions. Remove the override when no dependency needs an older version."
  - id: "babel-plugin-ember-template-compilation"
    status: "override"
    note: "An override forces the latest babel-plugin-ember-template-compilation for all dependencies, because v1 addons depend on older versions. Remove the override when no dependency needs an older version."
  - id: "ember-element-helper"
    status: "override"
    note: "An override forces the latest ember-element-helper for all dependencies, because v1 addons depend on older versions. Remove the override when no dependency needs an older version."
  - id: "vite-sass"
    status: "changed"
    note: "Vite compiles the app's Sass now, with sass (Dart Sass), and index.html links the Sass entry. Imports that ember-cli-sass found through app/styles, include paths, or addons are relative paths or package paths now, and the app declares bourbon, bourbon-neat, ember-power-select, ember-power-select-typeahead. Dart Sass deprecates some Sass features, such as `/` for division. Check the build output for warnings."
    links:
      - "https://vite.dev/guide/features.html#css-pre-processors"
  - id: "ember-cli-deploy"
    status: "removed"
    note: "ember-cli-deploy and its plugins are removed. Deploy the dist/ folder that `vite build` writes. For gzip and brotli files, use vite-plugin-compression2. For S3 uploads, use `aws s3 sync dist/`."
    links:
      - "https://github.com/nonzzz/vite-plugin-compression"
      - "https://vite.dev/guide/static-deploy"
  - id: "ember-export-application-global"
    status: "removed"
    note: "ember-export-application-global is removed. It put the application on window, named after the modulePrefix, for debugging. Ember Inspector finds the app without it. Code that reads that global needs another way to the app, such as the owner."
    links:
      - "https://github.com/ember-cli/ember-export-application-global"
  - id: "ember-try"
    status: "removed"
    note: "ember-try is removed. To test against other versions, use @embroider/try."
    links:
      - "https://github.com/embroider-build/embroider/tree/main/packages/try"
  - id: "ember-cli-code-coverage"
    status: "removed"
    note: "ember-cli-code-coverage is removed, because it instruments the ember-cli build. For coverage of a Vite build, add vite-plugin-istanbul."
    links:
      - "https://github.com/iFaxity/vite-plugin-istanbul"
  - id: "ember-percy"
    status: "removed"
    note: "ember-percy is removed, and so are the percySnapshot calls in the tests. @percy/ember has no v2 release yet. To take snapshots again, call @percy/sdk-utils from a test helper."
    links:
      - "https://github.com/percy/ember-percy"
      - "https://www.npmjs.com/package/@percy/sdk-utils"
  - id: "ember-power-select-typeahead"
    status: "removed"
    note: "ember-power-select-typeahead is replaced by ember-power-select with @searchEnabled and @searchFieldPosition=\"trigger\". Its styles are gone. Check the look of the search field in the trigger."
    links:
      - "https://ember-power-select.com/docs/the-search"
  - id: "ember-router-scroll"
    status: "replaced"
    note: "ember-router-scroll is replaced by @nullvoxpopuli/ember-router-scroll, a v2 fork of it that does not depend on ember-app-scheduler."
    links:
      - "https://github.com/NullVoxPopuli/ember-router-scroll"
  - id: "ember-cli-test-loader"
    status: "moved into the app"
    note: "ember-cli-test-loader is a v1 addon with no v2 release, so its code is in the app now, where ember-cli merged it. The code is now in tests/helpers/ember-cli-test-loader/index.js."
